# Control node (no Bluetooth) on the VPS: mesh hub over IP and admin panel.
#   ../vps-supervisor/vps-supervisor deploy deploy/btedge.yafb.net.yml
# Panel username/password are asked at the first deploy and stored on the host by
# vps-supervisor (re-ask with --ask NAME). The node key is generated on first start in
# the volume; admit the node into the mesh once, from the owner's machine:
#   python3 -m btedge enroll root@82.165.241.56 --state-dir /var/lib/btedge-control

app: btedge
host: root@82.165.241.56
domain: btedge.yafb.net

build:
  context: ..
  dockerfile: deploy/Dockerfile
port: 4646
healthcheck: /api/health

env:
  BTEDGE_NODE_NAME: btedge.yafb.net
  BTEDGE_PUBLIC_URL: https://btedge.yafb.net
  BTEDGE_MESH_OWNER: ssh-rsa 
  BTEDGE_ADMIN_USER: ${prompt:Username del pannello admin}
  BTEDGE_ADMIN_PASSWORD: ${secret:Password del pannello admin}

volumes:
  - /var/lib/btedge-control:/var/lib/btedge
  - /etc/machine-id:/etc/machine-id:ro      # binds the node certificate to this host
