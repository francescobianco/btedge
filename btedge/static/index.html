<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>btedge</title>
<style>
:root {
  --bg: #ffffff; --side: #fafafa; --hover: #f4f4f5; --sel: #eef2ff; --line: #ececee; --line2: #e2e2e6;
  --text: #18181b; --muted: #71717a; --faint: #a1a1aa;
  --accent: #5e6ad2; --ok: #22a06b; --warn: #d9a30a; --bad: #e5484d;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
  font: 13px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr) auto; height: 100vh; }

/* sidebar */
aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 9px; padding: 14px 16px 10px; font-weight: 600; font-size: 14px; }
.logo { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; }
.self { padding: 0 16px 12px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group { padding: 14px 16px 4px; color: var(--faint); font-size: 11px; font-weight: 500; }
.items { padding: 0 8px; overflow-y: auto; min-height: 0; }
.item { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; border-radius: 6px;
  padding: 5px 8px; cursor: pointer; text-align: left; color: var(--text); }
.item:hover { background: var(--hover); }
.item.on { background: #ececf0; }
.item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .count { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line); display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
.foot .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.foot .row span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }

/* main */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 20px; border-bottom: 1px solid var(--line); flex: none; }
.bar h1 { margin: 0; font-size: 14px; font-weight: 600; }
.bar .n { color: var(--faint); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 5px; padding: 3px 10px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--hover); color: var(--text); }
.search { margin-left: auto; width: 260px; max-width: 40vw; border: 1px solid var(--line2); border-radius: 7px; padding: 6px 10px;
  font: inherit; outline: none; background: var(--bg); }
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #5e6ad21f; }
.list { overflow-y: auto; flex: 1; }
.head, .dev { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.4fr) 110px minmax(0, 1.6fr) 72px; gap: 16px; align-items: center; padding: 0 20px; }
.head { position: sticky; top: 0; background: var(--bg); height: 34px; border-bottom: 1px solid var(--line); color: var(--faint); font-size: 12px; z-index: 1; }
.dev { min-height: 46px; border-bottom: 1px solid var(--line); cursor: pointer; }
.dev:hover { background: var(--hover); }
.dev.on { background: var(--sel); }
.dev.stale { color: var(--faint); }
.name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.name .t { min-width: 0; }
.name b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name b.unk { color: var(--faint); font-weight: 400; }
.mono { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; margin-right: 8px; vertical-align: -1px; }
.bars i { width: 3px; border-radius: 1px; background: var(--line2); }
.bars i.f { background: var(--text); }
.chips { display: flex; gap: 4px; overflow: hidden; }
.chip { border: 1px solid var(--line2); border-radius: 999px; padding: 0 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.chip.me { border-color: #c7cbf3; color: var(--accent); }
.empty { padding: 80px 20px; text-align: center; color: var(--faint); }
.av { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none; font-size: 11px; font-weight: 600; color: #fff; }

/* detail */
.detail { width: 0; overflow: hidden; border-left: 1px solid transparent; transition: width .18s ease; }
.detail.open { width: 360px; border-left-color: var(--line); }
.detail .in { width: 360px; height: 100vh; overflow-y: auto; padding: 16px 20px 24px; }
.detail header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.detail h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px; border-radius: 5px; }
.x:hover { background: var(--hover); color: var(--text); }
.field { margin-bottom: 18px; }
.field label { display: block; color: var(--faint); font-size: 12px; margin-bottom: 5px; }
.rename { display: flex; gap: 6px; }
.rename input { flex: 1; min-width: 0; border: 1px solid var(--line2); border-radius: 7px; padding: 6px 10px; font: inherit; outline: none; }
.rename input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #5e6ad21f; }
.btn { border: 0; border-radius: 7px; padding: 6px 12px; background: var(--accent); color: #fff; cursor: pointer; }
.props { display: grid; grid-template-columns: 110px 1fr; gap: 7px 12px; margin: 0; }
.props dt { color: var(--faint); } .props dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.seen div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
pre { margin: 0; padding: 12px; background: var(--side); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.5 var(--mono); overflow-x: auto; }
.note { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.act { border: 1px solid var(--line2); background: var(--bg); border-radius: 7px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.act:hover { background: var(--hover); }
.act:disabled { opacity: .55; cursor: default; }
.act-state { font-size: 12px; color: var(--muted); }
.act-state.ok { color: var(--ok); } .act-state.error { color: var(--bad); }
.tagline { display: inline-block; margin-top: 2px; color: var(--muted); font-size: 12px; }

@media (max-width: 900px) {
  .head, .dev { grid-template-columns: minmax(0, 1fr) 100px 60px; }
  .head > :nth-child(2), .dev > :nth-child(2), .head > :nth-child(4), .dev > :nth-child(4) { display: none; }
}
@media (max-width: 680px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .items { display: flex; flex-wrap: wrap; gap: 2px; } .item { width: auto; }
  .foot { display: none; }
  .bar { flex-wrap: wrap; height: auto; padding: 10px 16px; } .search { width: 100%; max-width: none; margin: 0; }
  .head, .dev { padding: 0 16px; }
  .list { overflow: visible; }
  .detail.open { position: fixed; inset: 0; width: auto; background: var(--bg); z-index: 5; }
  .detail .in { width: auto; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="logo">bt</span>btedge</div>
    <div class="self" id="self">…</div>
    <div class="group">Nodi</div>
    <div class="items" id="nodes"></div>
    <div class="foot" id="foot"></div>
  </aside>

  <main>
    <div class="bar">
      <h1>Dispositivi <span class="n" id="count"></span></h1>
      <div class="seg" id="seg">
        <button data-f="all" class="on">Tutti</button>
        <button data-f="named">Con nome</button>
        <button data-f="connected">Connessi</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Cerca nome, indirizzo, produttore…">
    </div>
    <div class="list">
      <div class="head"><span>Dispositivo</span><span>Tipo</span><span>Segnale</span><span>Visto da</span><span class="num">Visto</span></div>
      <div id="devices"></div>
    </div>
  </main>

  <div class="detail" id="detail"><div class="in" id="detail-in"></div></div>
</div>

<script>
const MAKERS = {0x004C:"Apple",0x0006:"Microsoft",0x0075:"Samsung",0x00E0:"Google",0x0087:"Garmin",
  0x0157:"Huami",0x038F:"Xiaomi",0x0059:"Nordic",0x02E5:"Espressif",0x0171:"Amazon",0x0057:"Harman",
  0x00C7:"Tile",0x0224:"Fitbit",0x009E:"Bose",0x01DA:"Logitech",0x000F:"Broadcom",0x0131:"Cypress",
  0x00D2:"Dialog",0x0310:"SGL Italia",0x027D:"Huawei",0x0499:"Ruuvi",0x0822:"Adafruit"};
const VIA = {lan: "LAN", ip: "IP"};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ui = {st: null, filter: "all", node: null, sel: null, panel: null, acts: {}};

function ago(s) {
  if (s == null) return "–";
  if (s < 5) return "ora";
  if (s < 60) return Math.round(s) + " s";
  if (s < 3600) return Math.round(s / 60) + " min";
  return Math.round(s / 3600) + " h";
}
const makerOf = l => l && l.length ? l.map(m => MAKERS[m] || "0x" + m.toString(16).padStart(4, "0")).join(", ") : "";
const isConnected = d => d.connected || d.seen_by.some(s => s.connected);
const title = d => d.label || d.name || "";
function kind(d) {
  const b = [], p = d.profile;
  if (p && p.class_label) b.push(p.class_label);
  if (p && p.label) b.push(p.label);
  else if (d.manufacturer) b.push(makerOf(d.manufacturer));
  if (d.icon) b.push(d.icon);
  return b.join(" · ");
}
function avatar(d) {
  let h = 0;
  for (const c of d.address) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const t = title(d) || makerOf(d.manufacturer) || "?";
  return `<span class="av" style="background:hsl(${h % 360} 55% 62%)">${esc(t.trim().slice(0, 1).toUpperCase())}</span>`;
}
function bars(rssi) {
  if (rssi == null) return '<span class="mono">–</span>';
  const n = rssi > -60 ? 4 : rssi > -70 ? 3 : rssi > -80 ? 2 : 1;
  return `<span class="bars">${[4, 7, 10, 12].map((h, i) => `<i class="${i < n ? "f" : ""}" style="height:${h}px"></i>`).join("")}</span><span class="mono">${rssi}</span>`;
}

function visible() {
  const st = ui.st, q = $("q").value.trim().toLowerCase();
  return st.devices.filter(d => {
    if (ui.node && !d.seen_by.some(s => s.node === ui.node)) return false;
    if (ui.filter === "named" && !title(d)) return false;
    if (ui.filter === "connected" && !isConnected(d)) return false;
    return !q || [d.label, d.name, d.address, kind(d), ...d.seen_by.map(s => s.name)].join(" ").toLowerCase().includes(q);
  }).sort((a, b) => isConnected(b) - isConnected(a) || !!title(b) - !!title(a));
}

function renderSide() {
  const st = ui.st;
  $("self").textContent = `${st.node.name} · ${st.node.role === "control" ? "controllo" : "edge"}`;
  const items = [`<button class="item${ui.node ? "" : " on"}" data-node=""><span class="dot ok"></span><span class="label">Tutta la mesh</span><span class="count">${st.devices.length}</span></button>`];
  for (const n of st.nodes) {
    const state = n.self || n.age < 20 ? "ok" : "warn";
    const sub = n.role === "control" ? " · controllo" : n.self ? " · questo" : "";
    const tip = n.id + (n.link ? " · " + (VIA[n.link.via] || n.link.via) + " " + (n.link.addr || "") : "");
    items.push(`<button class="item${ui.node === n.id ? " on" : ""}" data-node="${esc(n.id)}" title="${esc(tip)}">
      <span class="dot ${state}"></span><span class="label">${esc(n.name)}<span style="color:var(--faint)">${sub}</span></span><span class="count">${n.role === "control" ? "" : n.devices}</span></button>`);
  }
  $("nodes").innerHTML = items.join("");

  const f = [], sc = st.scanner, m = st.mesh || {};
  const row = (state, text) => f.push(`<div class="row"><span class="dot ${state}"></span><span>${esc(text)}</span></div>`);
  if (!sc) row("ok", "Senza Bluetooth");
  else row(sc.state === "scanning" ? "ok" : sc.state === "starting" ? "warn" : "bad",
    sc.state === "scanning" ? `Scansione · ${sc.adapter}` : sc.state === "no_adapter" ? "Nessun adattatore BT" : sc.error || "Bluetooth non attivo");
  if (m.lan && m.lan.enabled) row(m.lan.error ? "bad" : "ok", "LAN " + m.lan.group);
  for (const p of m.peers || []) row(p.ok ? "ok" : p.ok === false ? "bad" : "warn", p.url.replace(/^https?:\/\//, ""));
  if (m.owner) row(m.enrolled ? "ok" : "bad", (m.enrolled ? "Mesh " : "Non accreditato · ") + m.owner.slice(7, 19) + "…");
  if (st.join) f.push(`<button class="link" data-join>Collega un nodo edge</button>`);
  f.push(`<div class="row" style="color:var(--faint)"><span>btedge ${esc(st.version)}</span></div>`);
  $("foot").innerHTML = f.join("");
}

function renderList() {
  const rows = visible(), me = ui.st.node.id;
  $("count").textContent = rows.length;
  if (!rows.length) {
    $("devices").innerHTML = `<div class="empty">${ui.st.devices.length ? "Nessun dispositivo corrisponde." : "Nessun dispositivo rilevato per ora."}</div>`;
    return;
  }
  $("devices").innerHTML = rows.map(d => {
    const chips = d.seen_by.map(s => `<span class="chip${s.node === me ? " me" : ""}">${esc(s.name)}</span>`).join("");
    const t = title(d), k = kind(d);
    return `<div class="dev${d.age > 30 ? " stale" : ""}${ui.sel === d.address ? " on" : ""}" data-dev="${esc(d.address)}">
      <div class="name">${avatar(d)}<div class="t"><b class="${t ? "" : "unk"}">${esc(t || "Senza nome")}</b><span class="mono">${esc(d.address)}</span></div></div>
      <div class="ellip">${k ? esc(k) : '<span style="color:var(--faint)">–</span>'}${isConnected(d) ? ' · <span style="color:var(--ok)">connesso</span>' : ""}</div>
      <div>${bars(d.rssi)}</div>
      <div class="chips">${chips}</div>
      <div class="num">${ago(d.age)}</div>
    </div>`;
  }).join("");
}

function renderDetail() {
  const box = $("detail"), inner = $("detail-in");
  if (ui.panel === "join" && ui.st.join) {
    box.classList.add("open");
    const url = ui.st.join.url || location.origin;
    inner.innerHTML = `<header><h2>Collega un nodo edge</h2><button class="x" data-close>×</button></header>
      <p class="note">1. Sul nodo, in <span class="mono">/etc/btedge/config.json</span>, poi <span class="mono">systemctl restart btedge</span>:</p>
      <pre>${esc(JSON.stringify({mesh: {owner: ui.st.join.owner, peers: [url]}}, null, 2))}</pre>
      <p class="note" style="margin-top:14px">2. Il nodo genera la sua chiave e resta fuori dalla mesh. Solo il proprietario lo accredita, dalla macchina con la sua chiave SSH:</p>
      <pre>python3 -m btedge enroll root@&lt;nodo&gt;</pre>
      <p class="note" style="margin-top:14px">Il certificato vale solo per quel nodo su quella macchina.</p>`;
    return;
  }
  const d = ui.sel && ui.st.devices.find(x => x.address === ui.sel);
  if (!d) { box.classList.remove("open"); return; }
  box.classList.add("open");
  const focused = document.activeElement && document.activeElement.id === "label";
  const draft = focused ? $("label").value : null;
  const props = [["Indirizzo", `<span class="mono" style="color:var(--text)">${esc(d.address)}</span>`],
    ["Nome annunciato", esc(d.name || "–")], ["Produttore", esc(makerOf(d.manufacturer) || "–")],
    ["Tipo indirizzo", d.address_type ? (d.address_type === "random" ? "casuale" : "pubblico") : "–"],
    ["Stato", [isConnected(d) && "connesso", d.paired && "associato"].filter(Boolean).join(", ") || "–"],
    ["Ultimo segnale", ago(d.age)]];
  if (d.tx_power != null) props.push(["Potenza TX", esc(d.tx_power) + " dBm"]);
  if (d.uuids && d.uuids.length) props.push(["Servizi", `<span class="mono">${d.uuids.map(esc).join("<br>")}</span>`]);
  const p = d.profile, act = ui.acts[d.address];
  const busy = act && (act.status === "sending" || act.status === "pending" || act.status === "running");
  const stateText = !act ? "" : act.status === "sending" ? "Invio…" : act.status === "pending" ? `Inviato a ${esc(act.name || "nodo")}…`
    : act.status === "running" ? "In esecuzione…" : act.status === "ok" ? "Fatto" : esc(act.error || "Errore");
  const actions = p && p.actions.length ? `<div class="field"><label>Azioni</label><div class="actions">${p.actions.map(a =>
    `<button class="act" data-act="${esc(a.id)}"${busy ? " disabled" : ""}>${esc(a.label)}</button>`).join("")}
    <span class="act-state ${act ? esc(act.status) : ""}">${stateText}</span></div></div>` : "";
  const profileLine = p ? `<span class="tagline">${esc([p.class_label, p.label].filter(Boolean).join(" · "))}</span>` : "";
  inner.innerHTML = `<header>${avatar(d)}<div style="flex:1;min-width:0"><h2>${esc(title(d) || "Senza nome")}</h2>${profileLine}</div><button class="x" data-close>×</button></header>
    ${actions}
    <div class="field"><label for="label">Nome (condiviso con tutta la mesh)</label>
      <form class="rename" id="rename"><input id="label" maxlength="64" placeholder="Es. Telefono di Marco" value="${esc(draft ?? d.label ?? "")}"><button class="btn">Salva</button></form></div>
    <div class="field"><label>Dettagli</label><dl class="props">${props.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>
    <div class="field"><label>Visto da</label><div class="seen">${d.seen_by.map(s =>
      `<div><span>${esc(s.name)}${s.connected ? ' <span style="color:var(--ok)">· connesso</span>' : ""}</span><span>${bars(s.rssi)} <span class="mono">${ago(s.age)}</span></span></div>`).join("")}</div></div>`;
  if (focused) { const el = $("label"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function render() {
  if (!ui.st) return;
  document.title = `btedge · ${ui.st.node.name}`;
  renderSide(); renderList(); renderDetail();
}

async function runAction(address, action) {
  const set = v => { ui.acts[address] = v; renderDetail(); };
  set({status: "sending"});
  try {
    const r = await fetch("/api/action", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({address, action})});
    const res = await r.json();
    if (!r.ok) return set({status: "error", error: res.error});
    set({status: "pending", name: res.name});
    for (const started = Date.now(); Date.now() - started < 60000;) {
      await new Promise(ok => setTimeout(ok, 1000));
      const s = await (await fetch("/api/action?id=" + encodeURIComponent(res.id), {cache: "no-store"})).json();
      if (s.status !== "pending") set({status: s.status, error: s.error, name: res.name});
      if (s.status === "ok" || s.status === "error") return;
    }
    set({status: "error", error: "Nessuna risposta dal nodo"});
  } catch (e) {
    set({status: "error", error: "Rete non disponibile"});
  }
}

async function refresh() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    ui.st = await r.json();
    render();
  } catch (e) {
    $("self").textContent = "Nodo non raggiungibile";
  }
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-node],[data-dev],[data-f],[data-close],[data-join],[data-act]");
  if (!t) return;
  if (t.dataset.act) { runAction(ui.sel, t.dataset.act); return; }
  if (t.dataset.node !== undefined) ui.node = t.dataset.node || null;
  else if (t.dataset.dev) { ui.sel = ui.sel === t.dataset.dev && !ui.panel ? null : t.dataset.dev; ui.panel = null; }
  else if (t.dataset.f) { ui.filter = t.dataset.f; for (const b of $("seg").children) b.classList.toggle("on", b === t); }
  else if (t.dataset.close !== undefined) { ui.sel = null; ui.panel = null; }
  else if (t.dataset.join !== undefined) { ui.panel = "join"; ui.sel = null; }
  render();
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "rename") return;
  e.preventDefault();
  const label = $("label").value;
  $("label").blur();
  await fetch("/api/label", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({address: ui.sel, label})});
  refresh();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { ui.sel = null; ui.panel = null; render(); }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("q").focus(); }
});
$("q").addEventListener("input", renderList);
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
